services:
  # 1. Backend REST API (Node.js + Express)
  - type: web
    name: landslide-watch-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEMO_MODE
        value: false
      - key: FIREBASE_PROJECT_ID
        value: landslide-watch-sih

  # 2. Frontend React 18 GIS Dashboard
  - type: web
    name: landslide-watch-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
